# ============================================================
# MySQL para las actividades del RA2
#
# Arrancar:  docker compose up -d
# Parar:     docker compose stop
# Borrar todo y empezar de cero:  docker compose down -v
#
# La primera vez ejecuta solo los scripts de sql/ y deja la base
# `empresa` lista. Si cambias esos scripts, hace falta `down -v`
# para que los vuelva a ejecutar.
# ============================================================
services:
  mysql-ra2:
    image: mysql:8.4
    container_name: mysql-ra2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      # IZQUIERDA: el puerto en TU ordenador. Si el 3306 esta ocupado por
      # un MySQL que ya tengas instalado, cambialo aqui (por ejemplo 3307)
      # Y en la constante URL de las clases Java.
      - "127.0.0.1:3307:3307"
    volumes:
      - mysql-ra2-datos:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-ra2-datos:
